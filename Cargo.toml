[package]
name = "pso-cryptocurrency"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
ndarray = { version = "0.17" }
# ndarray = { version = "0.17", features = ["blas"] }
blas-src = { version = "0.10", features = ["openblas"] }
openblas-src = { version = "0.10", features = ["cblas", "system"] }
ndarray-rand = "0.16.0"
yahoo_finance_api = "5.0.0"
time = { version = "0.3.55", features = ["serde"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "chrono",
    "rust_decimal",
] }
anyhow = "1.0.104"
config = { version = "0.15.27", features = ["toml"] }
serde = { version = "1.0", features = ["derive"] }
dotenv = "0.15.0"
