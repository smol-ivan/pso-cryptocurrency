[database]
max_connections = 2

[dataset]
tickers = ["AAPL", "NVDA"]
start = 2024-01-01T00:00:00Z
end = 2024-01-10T23:59:59Z
# Cripto cotiza todos los días; para acciones usar aproximadamente 252.
periods_per_year = 365.0

[pso]
swarm_size = 50
iterations = 100
seed = 42

[pso.fitness]
# TODO: Investigate best way to determinate the value or scale for penalty 
penalty = 50.0
eps = 0.000001

[pso.fitness.risk]
kind = "variance"

[pso.velocity]
kind = "inertia"
c1 = 0.5
c2 = 0.9
inertia = 0.8

[single_test]
target_return = 0.01
