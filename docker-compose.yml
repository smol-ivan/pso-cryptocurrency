services:
    db:
        image: postgres:17
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${APP_DB}
        networks:
            - metanet1
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${APP_DB}"]
            interval: 5s
            retries: 10
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    metabase:
        image: metabase/metabase:v0.64-lts
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "127.0.0.1:3000:3000"
        environment:
            MB_DB_TYPE: postgres
            MB_DB_HOST: db
            MB_DB_PORT: 5432
            MB_DB_DBNAME: metabase
            MB_DB_USER: ${POSTGRES_USER}
            MB_DB_PASS: ${POSTGRES_PASSWORD}
        networks:
            - metanet1

volumes:
    pgdata:

networks:
    metanet1:
        driver: bridge
